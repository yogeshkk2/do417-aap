---
# Test of Facts
- name: Facts Demo
  hosts: win2.example.com
  gather_facts: true
  tasks:
  
    - name: Publish facts on a file
      ansible.windows.win_copy:
        content: |
          OS: {{ ansible_facts['os_name'] }}
          FQDN: {{ ansible_facts['fqdn'] }}
          Last Boot: {{ ansible_facts['lastboot'] }}
          IP Addresses: {{ ansible_facts['ip_addresses'] }}
        dest: C:\Users\devops\Desktop\myinfo.txt