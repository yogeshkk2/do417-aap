---
- name: Chocolatey Demo
  hosts: win1.example.com
  gather_facts: false
  tasks:
    - name: Deploy chocolatey first
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey

    - name: Mine for chocolatey facts on target
      chocolatey.chocolatey.win_chocolatey_facts:
        filter:
        - 'config'
        - 'feature'

    - debug:  
        var: "{{ ansible_chocolatey }}"
