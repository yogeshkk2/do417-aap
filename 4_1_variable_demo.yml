---
# Test of Multiplay
- name: First Play to publish a website
  hosts: win2.example.com
  gather_facts: false
  tasks:
    - name: Install {{ package }} package 
      ansible.windows.win_feature:
        name: "{{ package }}"
        state: present
    - name: Start {{ service }} service
      ansible.windows.win_service:
        name: "{{ service }}"
        state: started
    - name: Publish DO417 Website
      ansible.windows.win_copy:
        content: This is DO417 Test Website 
        dest: c:\Inetpub\wwwroot\index.html