---
- name: IIS Server Deployment
  hosts: win1.example.com
  gather_facts: false
  tasks:
    - name: Include the task to install packages
      ansible.builtin.import_tasks: tasks/task1.yml
      when: myvar is defined
      vars:
        web_packages:
          - Web-Server
    
    - name: Testing conditional 
      ansible.builtin.set_fact:
        myvar: true

    - name: Print value
      ansible.builtin.debug:
        var: myvar

    - name: Import the task2 file
      ansible.builtin.import_tasks: tasks/task2.yml
      vars:
        path: C:\Inetpub\wwwroot

- name: Import Play for testing
  ansible.builtin.import_playbook: tasks/testing.yml
  vars:
    weburl: 'http://win1.example.com'