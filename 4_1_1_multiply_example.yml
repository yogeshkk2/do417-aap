---
# Test of Multiplay
- name: First Play to publish a website
  hosts: IIS_WEB_SRV
  gather_facts: false
  tasks:
    - name: Install {{ package }}
      ansible.windows.win_feature:
        name: "{{ package }}"
        state: present
    - name: Start {{ service }} Service
      ansible.windows.win_service:
        name: "{{ service }}"
        state: started
      register: capture
    - debug:
        var: capture