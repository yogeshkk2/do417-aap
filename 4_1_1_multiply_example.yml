---
# Test of Multiplay
- name: First Play to publish a website
  hosts: win2.example.com
  gather_facts: false
  tasks:
    - name: Install Web Service
      ansible.windows.win_feature:
        name: "{{ package }}"
        state: present
    - name: Start Web Service
      ansible.windows.win_service:
        name: "{{ service }}"
        state: started